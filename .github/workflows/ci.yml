name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Android, JVM, JS, and Wasm targets
        run: |
          ./gradlew \
            ktfmtCheck \
            :svg:assemble \
            :svg:jvmTest \
            :svg:testAndroidHostTest \
            :svg:compileKotlinJs \
            :svg:compileKotlinWasmJs \
            :androidApp:assembleDebug \
            :composeApp:jvmTest \
            :composeApp:testAndroidHostTest

      - name: Verify non-Apple Maven publications locally
        run: |
          ./gradlew \
            :svg:publishAndroidPublicationToMavenLocal \
            :svg:publishJvmPublicationToMavenLocal \
            :svg:publishJsPublicationToMavenLocal \
            :svg:publishWasmJsPublicationToMavenLocal \
            :svg:publishKotlinMultiplatformPublicationToMavenLocal \
            -PskipSigning=true

  build-ios:
    name: Build & Verify Publications (macOS / iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS targets
        run: |
          ./gradlew \
            :svg:compileKotlinIosArm64 \
            :svg:compileKotlinIosSimulatorArm64 \
            :composeApp:compileKotlinIosArm64 \
            :composeApp:compileKotlinIosSimulatorArm64 \
            :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Verify full Maven publications locally
        run: ./gradlew :svg:publishToMavenLocal -PskipSigning=true
